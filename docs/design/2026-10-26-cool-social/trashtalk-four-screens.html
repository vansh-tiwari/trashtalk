<header class="review"><div><strong>TrashTalk / cooler heads, bigger egos</strong><small>Revised concept · four screens · sample data</small></div><nav class="views" aria-label="Design screens"><button data-screen="web-home" aria-pressed="true">Web · Home</button><button data-screen="web-result" aria-pressed="false">Web · Result</button><button data-screen="mobile-home" aria-pressed="false">Mobile · Home</button><button data-screen="mobile-result" aria-pressed="false">Mobile · Result</button></nav></header><main class="stage"><iframe id="design" title="TrashTalk revised design"></iframe></main>
<script>
const icons={arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',up:'<path d="M7 17 17 7M7 7h10v10"/>',swap:'<path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4 4-4-4 4-4"/>',share:'<path d="M12 16V3m-5 5 5-5 5 5M5 13v7h14v-7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',spark:'<path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8L12 2Z"/>'};
const icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
const monogram=(side,small=false)=>`<span class="avatar ${side===1?'av1':'av2'} ${small?'tiny':''}" aria-hidden="true">${side===1?'t':'p'}<svg viewBox="0 0 20 20"><path d="m10 1 2.4 6.6L19 10l-6.6 2.4L10 19l-2.4-6.6L1 10l6.6-2.4Z"/></svg></span>`;
const brand=()=>`<a class="brand" href="#" data-go="home"><span class="brandmark">${icon('spark',20)}</span>trashtalk<span class="brand-dot">.</span></a>`;
const nav=()=>`<header class="nav wrap">${brand()}<nav aria-label="Main"><button class="nav-text" data-scroll="how">how it works</button><a class="nav-text" href="https://github.com/vansh-tiwari/trashtalk" target="_blank" rel="noopener">the lore ${icon('up',13)}</a><button class="button compact" data-go="home">pick a rival ${icon('up',15)}</button></nav></header>`;
const footer=()=>`<footer class="wrap footer">${brand()}<span>started in 2020. still talking.</span><span class="demo-foot">concept / sample data</span></footer>`;
const pill=()=>`<span class="cf"><span></span>Codeforces</span>`;
const peek=()=>`<button class="peek" data-go="result" aria-label="Open tourist versus Petr demo"><div class="peek-top"><span>legendary matchup</span><span>demo ${icon('up',14)}</span></div><div class="peek-scores"><div>${monogram(1,true)}<h3>tourist</h3><b>97<span>/100</span></b></div><span class="peek-vs">vs</span><div>${monogram(2,true)}<h3>Petr</h3><b>90<span>/100</span></b></div></div><div class="peek-quote"><span class="micro">the roast</span><p>Same legendary status.<br>Different tax brackets.</p><span class="peek-margin">tourist +7 ${icon('up',14)}</span></div><div class="peek-bottom"><span>sample matchup</span><span>open the receipts ${icon('arrow',14)}</span></div></button>`;
const form=()=>`<form class="match-form" id="match-form"><div class="form-top"><span>who’s talking?</span>${pill()}</div><div class="fields"><label class="handle"><span>you</span><div><span>@</span><input id="you" aria-label="Your Codeforces handle" placeholder="your_handle" autocomplete="off" spellcheck="false"></div></label><button type="button" class="swap" aria-label="Swap handles" id="swap">${icon('swap',18)}</button><label class="handle"><span>your rival</span><div><span>@</span><input id="rival" aria-label="Your rival’s Codeforces handle" placeholder="their_handle" autocomplete="off" spellcheck="false"></div></label></div><div class="form-bottom"><label class="tone">roast style <select aria-label="Roast style"><option>savage dev</option><option>VC energy</option><option>fight night</option><option>hype friend</option></select></label><button class="button settle" type="submit">settle it ${icon('up',18)}</button></div></form>`;
const miniBars=()=>`<div class="mini-bars"><div><span>grit</span><i style="width:90%"></i><em style="width:70%"></em></div><div><span>peak</span><i style="width:96%"></i><em style="width:82%"></em></div><div><span>pace</span><i style="width:78%"></i><em style="width:60%"></em></div></div>`;
const home=()=>`${nav()}<main><section class="hero wrap"><div class="hero-left"><span class="eyebrow"><span class="little-star">✳</span> friendly rivalry. questionable friendships.</span><h1>all talk?<br>bring <em>receipts.</em></h1><p class="hero-sub">Two handles. One roast. Group chat material.</p>${form()}<div class="try"><span>just lurking?</span><button data-go="result">tourist vs Petr ${icon('up',13)}</button><span class="no-signup">no signup. just smoke.</span></div></div><div class="hero-art"><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><span class="art-asterisk">✳</span>${peek()}<span class="sticker">friendship pending ${icon('up',15)}</span></div></section><section class="wrap steps" id="how"><div><span>01</span> drop two handles</div><i>${icon('arrow',18)}</i><div><span>02</span> let the stats talk</div><i>${icon('arrow',18)}</i><div><span>03</span> send it to them</div></section><section class="wrap proof"><div class="proof-title"><span class="eyebrow">less ego. more evidence.</span><h2>the receipts<br> hit different.</h2><p>Beyond “my rating is higher.”</p></div><article class="proof-panel compare-proof"><div class="proof-visual">${miniBars()}</div><div class="proof-caption"><span>01 / the matchup</span><h3>stats don’t pick sides.</h3></div></article><article class="proof-panel overlap-proof"><div class="proof-visual"><div class="venn"><span>yours</span><b>both</b><span>theirs</span></div></div><div class="proof-caption"><span>02 / the overlap</span><h3>same grind. different flex.</h3></div></article></section></main>${footer()}`;
const player=(n)=>`<section class="player player${n}"><div class="player-id">${monogram(n)}<div><h2>${n===1?'tourist':'Petr'}</h2><span>legendary grandmaster</span></div>${n===1?'<span class="edge">+7</span>':''}</div><div class="player-stats"><div class="score">${n===1?'97':'90'}<span>/100</span></div><div class="rating"><b>${n===1?'3,840':'3,300'}</b><span>rating</span></div></div></section>`;
const metric=(label,a,b,max)=>`<div class="metric"><div class="metric-top"><b>${a.toLocaleString()}</b><span>${label}</span><b>${b.toLocaleString()}</b></div><div class="bar-pair"><span><i style="width:${a/max*100}%"></i></span><span><i style="width:${b/max*100}%"></i></span></div></div>`;
function radar(){const center=[150,139],r=95;const point=(i,v)=>{const a=(i*72-90)*Math.PI/180;return [150+Math.cos(a)*r*v,139+Math.sin(a)*r*v].join(',')};const poly=(v)=>v.map((x,i)=>point(i,x)).join(' ');return `<svg class="radar" viewBox="0 0 300 280" role="img" aria-label="Five-axis sample scores: tourist leads across grit, peak, solve volume, recent velocity, and topic breadth.">${[.25,.5,.75,1].map(x=>`<polygon points="${poly([x,x,x,x,x])}" fill="none" stroke="#dddfd8"/>`).join('')}${[0,1,2,3,4].map(i=>`<line x1="150" y1="139" x2="${point(i,1).split(',')[0]}" y2="${point(i,1).split(',')[1]}" stroke="#e1e3dc"/>`).join('')}<polygon points="${poly([.94,.95,.82,.70,.92])}" fill="#98b6a4" fill-opacity=".19" stroke="#668c76" stroke-width="2"/><polygon points="${poly([1,1,.95,.85,.96])}" fill="#888cca" fill-opacity=".22" stroke="#737ab5" stroke-width="2"/>${[['grit',150,22],['peak',269,111],['solves',224,254],['pace',75,254],['topics',31,111]].map(([s,x,y])=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Hanken,Arial,sans-serif" font-size="12" fill="#686d72">${s}</text>`).join('')}</svg>`}
const result=()=>`${nav()}<main class="wrap result"><div class="result-heading"><div><button class="back" data-go="home">the arena</button><span class="slash">/</span><span>tourist vs Petr</span><span class="demo-tag">demo</span></div><button class="button compact" data-open="share">share this ${icon('share',16)}</button></div><section class="scoreboard"><div class="match-meta">${pill()}<span>25 Oct 2026 <span class="meta-dot">·</span> recorded scores</span></div><div class="players">${player(1)}<span class="versus">vs</span>${player(2)}</div></section><section class="roast"><div class="roast-content"><div class="roast-meta"><span class="roast-dot"></span><b>tourist takes it</b><span class="divider">/</span><span>savage dev</span></div><h1>Petr brought the legacy.<br> Tourist brought the receipts.</h1></div><div class="roast-actions"><div class="reactions" aria-label="React to the roast"><button data-react aria-label="Dead laughing" aria-pressed="false">💀</button><button data-react aria-label="Crying laughing" aria-pressed="false">😭</button><button class="quote-copy" id="quote-copy" aria-label="Copy roast">${icon('copy',17)}</button></div><button class="rematch" data-go="home">run it back ${icon('swap',14)}</button></div></section><section class="numbers-grid"><div class="receipts"><div class="section-title"><h2>the receipts.</h2><div class="legend"><span><i></i>tourist</span><span><i></i>Petr</span></div></div>${metric('current rating',3840,3300,4009)}${metric('peak rating',4009,3500,4009)}${metric('recorded solves',1650,1100,1700)}${metric('recent accepts',42,25,45)}</div><div class="skills"><div class="section-title"><h2>skill check.</h2><span class="quiet">5 axes / 100</span></div>${radar()}</div></section><section class="problems"><div class="section-title problem-heading"><div><h2>same problems?</h2><p>common ground. uncommon flex.</p></div><div class="dna"><b>63<span>%</span></b><span>shared DNA</span></div></div><div class="dna-bar" aria-label="Sample problem sets: 2 only tourist, 5 shared, 1 only Petr"><span style="flex:2">2</span><span style="flex:5">5 shared</span><span style="flex:1">1</span></div><div class="explorer-tools"><div class="tabs" role="tablist" aria-label="Problem sets"><button data-tab="common" class="active" role="tab" aria-selected="true" aria-controls="list">both <span>5</span></button><button data-tab="p1" role="tab" aria-selected="false" aria-controls="list">only tourist <span>2</span></button><button data-tab="p2" role="tab" aria-selected="false" aria-controls="list">only Petr <span>1</span></button></div><label class="search">${icon('search',15)}<input id="search" aria-label="Search problems" placeholder="find a problem"></label></div><div id="list" role="tabpanel" aria-live="polite"></div><div class="list-note"><span id="count">5 sample problems</span><span>hardest first ${icon('arrow',12)}</span></div></section><section class="send-strip"><div class="send-icon">${icon('share',23)}</div><div><h3>group chat’s waiting.</h3><p>some receipts deserve an audience.</p></div><button class="button" data-open="share">send it ${icon('up',17)}</button></section><p class="scope">Demo data · recorded result · coverage unavailable</p></main>${footer()}`;
const modal=()=>`<dialog id="share" class="modal"><div class="modal-top"><h2>for the group chat.</h2><button data-close aria-label="Close share card">${icon('close',20)}</button></div><div class="share-preview"><div class="share-brand">${brand()}<span>Codeforces</span></div><div class="share-players"><div>${monogram(1,true)}<b>tourist</b><strong>97</strong></div><span>vs</span><div>${monogram(2,true)}<b>Petr</b><strong>90</strong></div></div><p>Petr brought the legacy.<br> Tourist brought the receipts.</p><div class="share-caption"><b>tourist takes it. +7</b><span>sample matchup</span></div></div><button class="button download" id="download">save card ${icon('up',17)}</button><p class="modal-note">Design preview · SVG download · sample data</p></dialog>`;
